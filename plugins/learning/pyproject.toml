[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "buddy-learning"
version = "1.0.0"
requires-python = ">=3.11"
description = "Folder-based EPUB library and private assessments for Buddy"
[tool.setuptools.packages.find]
include = ["buddy_learning*"]
