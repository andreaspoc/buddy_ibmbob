[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy-tetragon"
version = "1.0.0"
requires-python = ">=3.11"
description = "Buddy administrator app for scoped Tetragon blocking policies"

[tool.setuptools.packages.find]
include = ["buddy_tetragon*"]

[tool.setuptools.package-data]
buddy_tetragon = ["static/*", "static/**/*"]
