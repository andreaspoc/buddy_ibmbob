[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy-people"
version = "1.1.0"
requires-python = ">=3.11"
description = "Buddy people service, using the versioned Buddy runtime SDK"

[tool.setuptools.packages.find]
include = ["buddy_people*"]

[tool.setuptools.package-data]
buddy_people = ["static/**/*", "static/*"]
