# =============================================================================
# Bob ACP — single compose file
#
# PROFILES (set COMPOSE_PROFILES in .env, comma-separated):
#   https       — HAProxy TLS termination on port 443
#   office      — OnlyOffice document editor + office-plugin
#   people      — People chat plugin + people-worker
#   people-turn — TURN relay (primary NIC)
#   people-turn-vpn — TURN relay (VPN NIC)
#   projects    — Projects plugin
#   learning    — Learning plugin
#   tetragon    — Tetragon security plugin (unprivileged)
#   tetragon-host — Tetragon host daemon (privileged, opt-in)
#
# Example — enable everything except decisions:
#   COMPOSE_PROFILES=https,office,people,projects,learning,tetragon
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Core infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-bob}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-bob}"
    volumes:
      - bob-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-1.0}"
          memory: "${POSTGRES_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${POSTGRES_CPU_RESERVATION:-0.25}"
          memory: "${POSTGRES_MEMORY_RESERVATION:-128M}"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - bob-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${OLLAMA_CPU_LIMIT:-4.0}"
          memory: "${OLLAMA_MEMORY_LIMIT:-4G}"
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Downloading or verifying Granite embedding model..."
        ollama pull granite-embedding:278m
        echo "Granite embedding model ready."
    restart: "no"

  # ---------------------------------------------------------------------------
  # Bob core services
  # ---------------------------------------------------------------------------
  bob-agent:
    security_opt:
      - apparmor=buddy-sandbox
      - seccomp=./deploy/security/buddy-sandbox-seccomp.json
      - systempaths=unconfined
    image: "${BUDDY_CORE_IMAGE:-bob-acp-core:1.1.0}"
    build:
      context: .
      args:
        BUDDY_RUNTIME_IMAGE: "${BUDDY_RUNTIME_IMAGE:-bob-acp-runtime:1.1.0}"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      # HTTP port 3000 disabled; use the HTTPS proxy on port 443.
      # - "${BOB_BIND_IP:-0.0.0.0}:${BOB_PORT:-3000}:8080"
      - "${BOB_HTTP_BIND_IP:-127.0.0.1}:${BOB_ALT_PORT:-8080}:8080"
    volumes:
      - ./app:/opt/bob-a2a/app
      - ./workspace:/workspace
      - ./.bob-private:/root/.bob
      - ./deploy/apps:/opt/bob-a2a/app-manifests:ro
    environment: &bob-env
      BUDDY_LEARNING_ENABLED: "${BUDDY_LEARNING_ENABLED:-0}"
      BUDDY_LEARNING_PLUGIN_URL: "${BUDDY_LEARNING_PLUGIN_URL:-}"
      BUDDY_OFFICE_PLUGIN_URL: "${BUDDY_OFFICE_PLUGIN_URL:-}"
      BUDDY_PEOPLE_PLUGIN_URL: "${BUDDY_PEOPLE_PLUGIN_URL:-}"
      BUDDY_DECISIONS_ENABLED: "${BUDDY_DECISIONS_ENABLED:-0}"
      BUDDY_DECISIONS_PLUGIN_URL: "${BUDDY_DECISIONS_PLUGIN_URL:-}"
      BUDDY_DECISIONS_GOVERNANCE_TTL_SECONDS: "${BUDDY_DECISIONS_GOVERNANCE_TTL_SECONDS:-3600}"
      BUDDY_CP4D_ENCRYPTION_KEY: "${BUDDY_CP4D_ENCRYPTION_KEY:-}"
      BUDDY_PROJECTS_PLUGIN_URL: "${BUDDY_PROJECTS_PLUGIN_URL:-}"
      BUDDY_OFFICE_ENABLED: "${BUDDY_OFFICE_ENABLED:-0}"
      BUDDY_PEOPLE_ENABLED: "${BUDDY_PEOPLE_ENABLED:-0}"
      BUDDY_PROJECTS_ENABLED: "${BUDDY_PROJECTS_ENABLED:-0}"
      BOB_API_KEY: "${BOB_API_KEY:-}"
      BOBSHELL_API_KEY: "${BOB_API_KEY:-}"
      BOB_TEAM_ID: "${BOB_TEAM_ID:-}"
      BUDDY_NAME: "${BUDDY_NAME:-}"
      BUDDY_ORGANIZATION: "${BUDDY_ORGANIZATION:-}"
      BUDDY_INITIAL_ADMIN_EMAIL: "${BUDDY_INITIAL_ADMIN_EMAIL:-}"
      BOB_WORKSPACE: "/workspace"
      BOB_MCP_SETTINGS_FILE: "/root/.bob/mcp_settings.json"
      BOB_A2A_ALLOWED_ORIGINS: "${BOB_A2A_ALLOWED_ORIGINS:-}"
      BOB_MCP_ALLOWED_ORIGINS: "${BOB_MCP_ALLOWED_ORIGINS:-}"
      PYTHONPATH: "/opt/bob-a2a"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:3000}"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      KEYCLOAK_HOST_IP: "${KEYCLOAK_HOST_IP:-}"
      KEYCLOAK_ISSUER: "${KEYCLOAK_ISSUER:-}"
      KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID:-}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:-}"
      KEYCLOAK_REDIRECT_URI: "${KEYCLOAK_REDIRECT_URI:-}"
      KEYCLOAK_ADMIN_SUBJECTS: "${KEYCLOAK_ADMIN_SUBJECTS:-}"
      BOB_LOCAL_LOGIN_ENABLED: "${BOB_LOCAL_LOGIN_ENABLED:-0}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-common}"
      AZURE_REDIRECT_URI: "${AZURE_REDIRECT_URI:-}"
      GRAPH_SCOPES: "${GRAPH_SCOPES:-}"
      GRAPH_API_BASE: "${GRAPH_API_BASE:-https://graph.microsoft.com/v1.0}"
      BOB_REQUEST_TIMEOUT: "${BOB_REQUEST_TIMEOUT:-900}"
      BUDDY_MEMORY_SIGNING_KEY: "${BUDDY_MEMORY_SIGNING_KEY:-}"
      BUDDY_AGENT_MAX_TOOL_CALLS: "${BUDDY_AGENT_MAX_TOOL_CALLS:-100}"
      BUDDY_AGENT_MAX_INFERENCE_CALLS: "${BUDDY_AGENT_MAX_INFERENCE_CALLS:-16}"
      BUDDY_AGENT_MAX_REMOTE_CALLS: "${BUDDY_AGENT_MAX_REMOTE_CALLS:-6}"
      BUDDY_AGENT_MAX_SPECIALIST_CALLS: "${BUDDY_AGENT_MAX_SPECIALIST_CALLS:-6}"
      BUDDY_AGENT_MAX_DAILY_ACTIONS: "${BUDDY_AGENT_MAX_DAILY_ACTIONS:-1000}"
      BUDDY_AGENT_MAX_RUN_SECONDS: "${BUDDY_AGENT_MAX_RUN_SECONDS:-3600}"
      BOB_AGENT_PREWARM: "${BOB_AGENT_PREWARM:-1}"
      BOB_A2A_ALLOW_PUBLIC_PORTS: "${BOB_A2A_ALLOW_PUBLIC_PORTS:-0}"
      BOB_A2A_RELAXED_ORIGINS: "${BOB_A2A_RELAXED_ORIGINS:-0}"
      BOB_OLLAMA_URL: "http://ollama:11434"
      BOB_EMBEDDING_MODEL: "${BOB_EMBEDDING_MODEL:-granite-embedding:278m}"
      BOB_PRESENTATION_TIMEOUT: "${BOB_PRESENTATION_TIMEOUT:-1800}"
      DEFAULT_TIMEZONE: "${DEFAULT_TIMEZONE:-UTC}"
      BOB_FILE_STORAGE: "${BOB_FILE_STORAGE:-postgres}"
      PEOPLE_ICE_SERVERS: "${PEOPLE_ICE_SERVERS:-[]}"
      BUDDY_APP_AGENT_SECRET: "${BUDDY_APP_AGENT_SECRET:-}"
      OFFICE_JWT_SECRET: "${OFFICE_JWT_SECRET:-}"
      OFFICE_INTERNAL_URL: "http://onlyoffice"
      DOCMOST_URL: "${DOCMOST_URL:-}"
      DOCMOST_ALLOWED_USERS: "${DOCMOST_ALLOWED_USERS:-}"
      DOCMOST_ALLOWED_GROUPS: "${DOCMOST_ALLOWED_GROUPS:-}"
      DOCMOST_EMBED: "${DOCMOST_EMBED:-0}"
      OFFICE_PUBLIC_URL: "/office-editor"
      OFFICE_CALLBACK_BASE_URL: "http://bob-agent:8080"
      BOB_S3_BUCKET: "${BOB_S3_BUCKET:-}"
      BOB_S3_ENDPOINT: "${BOB_S3_ENDPOINT:-}"
      BOB_S3_REGION: "${BOB_S3_REGION:-}"
      BOB_S3_ACCESS_KEY_ID: "${BOB_S3_ACCESS_KEY_ID:-}"
      BOB_S3_SECRET_ACCESS_KEY: "${BOB_S3_SECRET_ACCESS_KEY:-}"
      BOB_API_UPSTREAM: "${BOB_API_UPSTREAM:-https://api.us-east.bob.ibm.com}"
      BOB_INTERNAL_A2A_URL: "${BOB_INTERNAL_A2A_URL:-http://bob-agent:8080/a2a}"
      BRAVE_SEARCH_API: "${BRAVE_SEARCH_API:-https://api.search.brave.com/res/v1/web/search}"
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
      BOB_FORCE_AUTO_APPROVE: "${BOB_FORCE_AUTO_APPROVE:-0}"
      BOB_UI_SECURE_COOKIE: "${BOB_UI_SECURE_COOKIE:-0}"
      BUDDY_TETRAGON_ENABLED: "${BUDDY_TETRAGON_ENABLED:-0}"
      BUDDY_TETRAGON_PLUGIN_URL: "${BUDDY_TETRAGON_PLUGIN_URL:-}"
    deploy:
      resources:
        limits:
          cpus: "${BOB_CPU_LIMIT:-2.0}"
          memory: "${BOB_MEMORY_LIMIT:-2048M}"
        reservations:
          cpus: "${BOB_CPU_RESERVATION:-0.5}"
          memory: "${BOB_MEMORY_RESERVATION:-512M}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  bob-gateway:
    security_opt:
      - apparmor=buddy-sandbox
      - seccomp=./deploy/security/buddy-sandbox-seccomp.json
      - systempaths=unconfined
    image: "${BUDDY_CORE_IMAGE:-bob-acp-core:1.1.0}"
    build:
      context: .
      args:
        BUDDY_RUNTIME_IMAGE: "${BUDDY_RUNTIME_IMAGE:-bob-acp-runtime:1.1.0}"
    command: ["python3", "-m", "uvicorn", "app.gateway:app", "--app-dir", "/opt/bob-a2a", "--host", "0.0.0.0", "--port", "8090"]
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "${BOB_HTTP_BIND_IP:-127.0.0.1}:${BOB_GATEWAY_PORT:-8090}:8090"
    volumes:
      - ./app:/opt/bob-a2a/app
      - ./workspace:/workspace
      - ./.bob-private:/root/.bob
      - ./deploy/apps:/opt/bob-a2a/app-manifests:ro
    environment: *bob-env
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
        reservations:
          cpus: "0.2"
          memory: "128M"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  bob-worker:
    security_opt:
      - apparmor=buddy-sandbox
      - seccomp=./deploy/security/buddy-sandbox-seccomp.json
      - systempaths=unconfined
    image: "${BUDDY_CORE_IMAGE:-bob-acp-core:1.1.0}"
    build:
      context: .
      args:
        BUDDY_RUNTIME_IMAGE: "${BUDDY_RUNTIME_IMAGE:-bob-acp-runtime:1.1.0}"
    command: ["python3", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./app:/opt/bob-a2a/app
      - ./workspace:/workspace
      - ./.bob-private:/root/.bob
    environment: *bob-env
    deploy:
      resources:
        limits:
          cpus: "${BOB_CPU_LIMIT:-2.0}"
          memory: "${BOB_MEMORY_LIMIT:-2048M}"
        reservations:
          cpus: "${BOB_CPU_RESERVATION:-0.5}"
          memory: "${BOB_MEMORY_RESERVATION:-512M}"
    restart: unless-stopped

  knowledge-worker:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    image: "${BUDDY_KNOWLEDGE_IMAGE:-bob-acp-knowledge-worker}"
    build:
      context: .
      dockerfile: Dockerfile.knowledge
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./app:/opt/bob-a2a/app:ro
      - bob-docling-models:/models
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      BOB_OLLAMA_URL: "http://ollama:11434"
      BOB_EMBEDDING_MODEL: "${BOB_EMBEDDING_MODEL:-granite-embedding:278m}"
      BOB_FILE_STORAGE: "${BOB_FILE_STORAGE:-postgres}"
      BOB_S3_BUCKET: "${BOB_S3_BUCKET:-}"
      BOB_S3_ENDPOINT: "${BOB_S3_ENDPOINT:-}"
      BOB_S3_REGION: "${BOB_S3_REGION:-}"
      BOB_S3_ACCESS_KEY_ID: "${BOB_S3_ACCESS_KEY_ID:-}"
      BOB_S3_SECRET_ACCESS_KEY: "${BOB_S3_SECRET_ACCESS_KEY:-}"
      HF_HOME: "/models/huggingface"
      XDG_CACHE_HOME: "/models/cache"
    deploy:
      resources:
        limits:
          cpus: "${KNOWLEDGE_CPU_LIMIT:-2.0}"
          memory: "${KNOWLEDGE_MEMORY_LIMIT:-4G}"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Profile: https — HAProxy TLS on port 443
  # Install cert at deploy/https/certs/ and set BOB_UI_SECURE_COOKIE=1
  # ---------------------------------------------------------------------------
  https-proxy:
    profiles: ["https"]
    image: haproxy:alpine
    ports:
      - "${BOB_BIND_IP:-0.0.0.0}:443:443"
    volumes:
      - ./deploy/https/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./deploy/https/certs:/etc/haproxy/certs:ro
    depends_on:
      - bob-agent
      - bob-gateway
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Profile: office — OnlyOffice document editor
  # ---------------------------------------------------------------------------
  onlyoffice:
    profiles: ["office"]
    image: onlyoffice/documentserver:9.3.1
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${OFFICE_JWT_SECRET:-}"
      JWT_HEADER: "Authorization"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - bob-office-data:/var/www/onlyoffice/Data
      - bob-office-lib:/var/lib/onlyoffice
      - bob-office-db:/var/lib/postgresql
    shm_size: "256m"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4G"
    restart: unless-stopped

  office-plugin:
    profiles: ["office"]
    security_opt:
      - apparmor=buddy-sandbox
      - seccomp=./deploy/security/buddy-sandbox-seccomp.json
      - systempaths=unconfined
    image: "${BUDDY_OFFICE_IMAGE:-bob-acp-office:1.1.0}"
    build:
      context: .
      dockerfile: plugins/office/Dockerfile
      args:
        BUDDY_RUNTIME_IMAGE: "${BUDDY_RUNTIME_IMAGE:-bob-acp-runtime:1.1.0}"
    command: ["uvicorn", "buddy_office.service:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      postgres:
        condition: service_healthy
      onlyoffice:
        condition: service_started
    volumes:
      - ./app:/opt/bob-a2a/app
      - ./workspace:/workspace
      - ./.bob-private:/root/.bob
    environment:
      <<: *bob-env
      BUDDY_OFFICE_ENABLED: "1"
      BUDDY_PEOPLE_ENABLED: "0"
      BUDDY_PLUGIN_SERVICE: "office"
      BUDDY_OFFICE_PLUGIN_URL: ""
      BUDDY_PEOPLE_PLUGIN_URL: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12

  # ---------------------------------------------------------------------------
  # Profile: people — People chat plugin
  # ---------------------------------------------------------------------------
  people-plugin:
    profiles: ["people"]
    image: "${BUDDY_PEOPLE_IMAGE:-bob-acp-people:1.1.0}"
    build:
      context: .
      dockerfile: plugins/people/Dockerfile
      args:
        BUDDY_RUNTIME_IMAGE: "${BUDDY_RUNTIME_IMAGE:-bob-acp-runtime:1.1.0}"
    command: ["uvicorn", "buddy_people.service:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/opt/bob-a2a/app
      - ./workspace:/workspace
      - ./.bob-private:/root/.bob
    environment:
      <<: *bob-env
      BUDDY_OFFICE_ENABLED: "0"
      BUDDY_PEOPLE_ENABLED: "1"
      BUDDY_PLUGIN_SERVICE: "people"
      PEOPLE_AUDIO_TRANSPORT: "${PEOPLE_AUDIO_TRANSPORT:-websocket}"
      PEOPLE_TURN_URLS: "${PEOPLE_TURN_URLS:-[]}"
      PEOPLE_TURN_SECRET: "${PEOPLE_TURN_SECRET:-}"
      BUDDY_OFFICE_PLUGIN_URL: ""
      BUDDY_PEOPLE_PLUGIN_URL: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12

  people-worker:
    profiles: ["people"]
    image: "${BUDDY_PEOPLE_IMAGE:-bob-acp-people:1.1.0}"
    build:
      context: .
      dockerfile: plugins/people/Dockerfile
      args:
        BUDDY_RUNTIME_IMAGE: "${BUDDY_RUNTIME_IMAGE:-bob-acp-runtime:1.1.0}"
    command: ["python3", "-m", "buddy_people.worker"]
    depends_on:
      people-plugin:
        condition: service_healthy
    volumes:
      - ./app:/opt/bob-a2a/app
      - ./workspace:/workspace
      - ./.bob-private:/root/.bob
    environment:
      <<: *bob-env
      BUDDY_OFFICE_ENABLED: "0"
      BUDDY_PEOPLE_ENABLED: "1"
      BUDDY_PLUGIN_SERVICE: "people"
      BUDDY_OFFICE_PLUGIN_URL: ""
      BUDDY_PEOPLE_PLUGIN_URL: ""
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Profile: people-turn — TURN relay (primary NIC)
  # Profile: people-turn-vpn — TURN relay (VPN NIC)
  # Configure with deploy/turn/configure.py before enabling.
  # ---------------------------------------------------------------------------
  people-turn:
    profiles: ["people-turn"]
    image: coturn/coturn:4.18.0-r0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:uid=65534,gid=65534,mode=0700
      - /var/lib/coturn:uid=65534,gid=65534,mode=0700
    volumes:
      - ./.secrets/people-turn.conf:/etc/coturn/turnserver.conf:ro
    environment:
      PEOPLE_TURN_BIND_IP: "${PEOPLE_TURN_BIND_IP:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient -p 3478 $$PEOPLE_TURN_BIND_IP >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3

  people-turn-vpn:
    profiles: ["people-turn-vpn"]
    image: coturn/coturn:4.18.0-r0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:uid=65534,gid=65534,mode=0700
      - /var/lib/coturn:uid=65534,gid=65534,mode=0700
    volumes:
      - ./.secrets/people-turn-vpn.conf:/etc/coturn/turnserver.conf:ro
    environment:
      PEOPLE_TURN_BIND_IP: "${PEOPLE_TURN_VPN_BIND_IP:-127.0.0.1}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient -p 3478 $$PEOPLE_TURN_BIND_IP >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Profile: projects — Projects plugin
  # ---------------------------------------------------------------------------
  projects-plugin:
    profiles: ["projects"]
    image: "${BUDDY_PROJECTS_IMAGE:-bob-acp-projects:1.1.0}"
    build:
      context: .
      dockerfile: plugins/projects/Dockerfile
      args:
        BUDDY_RUNTIME_IMAGE: "${BUDDY_RUNTIME_IMAGE:-bob-acp-runtime:1.1.0}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/opt/bob-a2a/app
      - ./workspace:/workspace
      - ./.bob-private:/root/.bob
    environment:
      <<: *bob-env
      BUDDY_PLUGIN_SERVICE: "projects"
      BUDDY_PROJECTS_ENABLED: "1"
      BUDDY_DECISIONS_ENABLED: "${BUDDY_DECISIONS_ENABLED:-0}"
      BUDDY_DECISIONS_PLUGIN_URL: "${BUDDY_DECISIONS_PLUGIN_URL:-}"
      BUDDY_DECISIONS_GOVERNANCE_TTL_SECONDS: "${BUDDY_DECISIONS_GOVERNANCE_TTL_SECONDS:-3600}"
      BUDDY_CP4D_ENCRYPTION_KEY: "${BUDDY_CP4D_ENCRYPTION_KEY:-}"
      BUDDY_PROJECTS_PLUGIN_URL: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12

  # ---------------------------------------------------------------------------
  # Profile: learning — Learning library plugin
  # ---------------------------------------------------------------------------
  learning-plugin:
    profiles: ["learning"]
    image: "${BUDDY_LEARNING_IMAGE:-bob-acp-learning:1.0.0}"
    build:
      context: .
      dockerfile: plugins/learning/Dockerfile
      args:
        BUDDY_RUNTIME_IMAGE: "${BUDDY_RUNTIME_IMAGE:-bob-acp-runtime:1.1.0}"
    security_opt:
      - apparmor=buddy-sandbox
      - seccomp=./deploy/security/buddy-sandbox-seccomp.json
      - systempaths=unconfined
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/opt/bob-a2a/app
    environment:
      <<: *bob-env
      BUDDY_PLUGIN_SERVICE: "learning"
      BUDDY_LEARNING_TEACHER_GROUP: "${BUDDY_LEARNING_TEACHER_GROUP:-/teacher}"
      BUDDY_LEARNING_ENABLED: "1"
      BUDDY_LEARNING_PLUGIN_URL: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12

  # ---------------------------------------------------------------------------
  # Profile: tetragon — Tetragon security plugin (unprivileged)
  # Profile: tetragon-host — Tetragon host daemon (privileged, opt-in)
  # Read plugins/tetragon/README.md before enabling tetragon-host.
  # ---------------------------------------------------------------------------
  tetragon-plugin:
    profiles: ["tetragon"]
    image: "${BUDDY_TETRAGON_IMAGE:-buddy-tetragon:1.0.0}"
    build:
      context: .
      dockerfile: plugins/tetragon/Dockerfile
      args:
        BUDDY_RUNTIME_IMAGE: "${BUDDY_RUNTIME_IMAGE:-bob-acp-runtime:1.1.0}"
        TETRAGON_IMAGE: "${TETRAGON_IMAGE:-quay.io/cilium/tetragon:v1.7.1@sha256:afc9458ba4bc3f2795da3df6b03d88ce50e175ac3903027de8036e2046b84a02}"
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:3000}"
      BUDDY_TETRA_BIN: /usr/local/bin/tetra
      BUDDY_TETRAGON_ADDRESS: unix:///var/run/tetragon/tetragon.sock
      BUDDY_TETRAGON_DB: /data/rules.sqlite
      PYTHONPATH: /opt/bob-a2a
    volumes:
      - buddy-tetragon-data:/data
      - buddy-tetragon-socket:/var/run/tetragon:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready',timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
    restart: unless-stopped

  tetragon-host:
    profiles: ["tetragon-host"]
    image: "${TETRAGON_IMAGE:-quay.io/cilium/tetragon:v1.7.1@sha256:afc9458ba4bc3f2795da3df6b03d88ce50e175ac3903027de8036e2046b84a02}"
    privileged: true
    pid: host
    cgroup: host
    network_mode: none
    command:
      - --server-address=unix:///var/run/tetragon/tetragon.sock
      - --enable-k8s-api=false
      - --enable-tracing-policy-crd=false
      - --health-server-address=
      - --log-format=json
    volumes:
      - type: bind
        source: /sys/kernel/btf/vmlinux
        target: /var/lib/tetragon/btf
        read_only: true
        bind:
          create_host_path: false
      - buddy-tetragon-socket:/var/run/tetragon
    restart: unless-stopped

volumes:
  bob-postgres:
  bob-docling-models:
  bob-ollama:
  bob-office-data:
  bob-office-lib:
  bob-office-db:
  buddy-tetragon-data:
  buddy-tetragon-socket:
