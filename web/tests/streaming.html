<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Streaming test fixture</title></head><body><nav aria-label="Streaming preview controls"><strong>Streaming preview · sample text</strong> <button id="start">Start streaming</button> <button id="stop">Stop streaming</button></nav><div id="root"></div><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { flushSync } from 'react-dom';
import { ChatView } from '/src/components/ChatView.tsx';
import '/src/styles.css';
import {createTextStream} from '/src/lib/streamText.ts';
const root=createRoot(document.getElementById('root'));
const noop=()=>{};
window.renderAnswer=(content,isStreaming,activity={})=>flushSync(()=>root.render(React.createElement('div',{style:{height:'600px',display:'flex',flexDirection:'column'}},React.createElement(ChatView,{messages:[{id:'stable',role:'assistant',content,isStreaming,...activity}],isStreaming,activeMode:'agent',slideCount:8,onSlideCountChange:noop,activeAgent:'',modes:[],skills:[],agents:[],templates:[],selectedTemplateId:'',onSendMessage:noop,canGuideResponse:true,onGuideResponse:async()=>{},onUploadFile:noop,onStop:noop,onOpenTemplateModal:noop}))));
let text = '';
let timer;
const stream = createTextStream(chunk => {text += chunk; window.renderAnswer(text,true);});
const sample = 'Responses now display as they arrive.\n\n**Live Markdown** remains readable while the answer grows.\n\n1. Incoming text appears on the next frame.\n2. Completion keeps every received character.\n3. Scrolling follows the response until you scroll up.\n\nThis is sample text for the streaming preview.';
document.getElementById('start').onclick = () => {
 clearInterval(timer); stream.clear(); text=''; let offset=0; window.renderAnswer('',true);
 timer=setInterval(()=>{stream.push(sample.slice(offset,offset+8));offset+=8;if(offset>=sample.length){clearInterval(timer);stream.drain().then(()=>window.renderAnswer(text,false));}},80);
};
document.getElementById('stop').onclick=()=>{clearInterval(timer);stream.flush();window.renderAnswer(text,false);};
window.renderAnswer('Intro.\n\n1. First\n2. Second',true);
</script></body></html>
