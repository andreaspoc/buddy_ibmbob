# Configure with deploy/turn/configure.py. Separate listeners keep relay candidates on the network the client actually reached.
x-people-turn: &people-turn
  image: coturn/coturn:4.18.0-r0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
  network_mode: host
  command: ["-c", "/etc/coturn/turnserver.conf"]
  read_only: true
  cap_drop: ["ALL"]
  cap_add: ["NET_BIND_SERVICE"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:uid=65534,gid=65534,mode=0700
    - /var/lib/coturn:uid=65534,gid=65534,mode=0700
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "turnutils_stunclient -p 3478 $$PEOPLE_TURN_BIND_IP >/dev/null 2>&1"]
    interval: 15s
    timeout: 5s
    retries: 3
services:
  people-turn:
    <<: *people-turn
    profiles: ["people-turn"]
    volumes:
      - ./.secrets/people-turn.conf:/etc/coturn/turnserver.conf:ro
    environment:
      PEOPLE_TURN_BIND_IP: "${PEOPLE_TURN_BIND_IP:?Run deploy/turn/configure.py}"
  people-turn-vpn:
    <<: *people-turn
    profiles: ["people-turn-vpn"]
    volumes:
      - ./.secrets/people-turn-vpn.conf:/etc/coturn/turnserver.conf:ro
    environment:
      PEOPLE_TURN_BIND_IP: "${PEOPLE_TURN_VPN_BIND_IP:-127.0.0.1}"
