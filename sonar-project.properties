# Keep the established project and import measured Python coverage.
# Authentication and server location remain in the scanner environment.
sonar.projectKey=docker
# Installed third-party packages are restored by the package manager, not maintained here.
sonar.sources=.
sonar.tests=.
# Tests remain analyzed as tests, separate from production code.
sonar.test.inclusions=**/tests/**,**/test/**,**/__tests__/**,**/test_*.py,**/*_test.py,**/*_test.go,**/*.test.*,**/*.spec.*,bindings/nodejs/test.js
sonar.test.exclusions=**/target/**,**/node_modules/**,.venv/**,**/.venv/**,backups/**,workspace/users/**,.bob-private/**,.codex/**,.agents/**,.aws/**,.secrets/**,.scannerwork/**,reports/**,web/coverage/**,coverage/**,**/__pycache__/**,**/*.dump,**/*.db,**/*.sqlite3,app/zen/**
sonar.exclusions=app/vendor/**,**/target/**,.venv/**,**/.venv/**,backups/**,workspace/users/**,.bob-private/**,.codex/**,.agents/**,.aws/**,.secrets/**,.scannerwork/**,reports/**,web/coverage/**,coverage/**,**/__pycache__/**,**/*.dump,**/*.db,**/*.sqlite3,app/zen/**,**/node_modules/**,**/tests/**,**/test/**,**/__tests__/**,**/test_*.py,**/*_test.py,**/*_test.go,**/*.test.*,**/*.spec.*,bindings/nodejs/test.js
sonar.coverage.exclusions=artifacts/**,scripts/**,deploy/**,examples/**
sonar.python.coverage.reportPaths=reports/sonar-python/coverage.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.go.coverage.reportPaths=reports/sonar-go/coverage.out
sonar.coverage.jacoco.xmlReportPaths=bindings/java/target/site/jacoco/jacoco.xml
