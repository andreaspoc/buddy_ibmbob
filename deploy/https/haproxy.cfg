global
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client  1800s
    timeout server  1800s
    timeout tunnel  1800s
    option forwardfor
    option http-keep-alive

frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/haproxy.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]

    # HSTS
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Limit request body size to 50 MB
    http-request deny if { req.body_len gt 52428800 }

    # Route WebSocket connections for /ws/gateway to the gateway backend
    acl is_ws_gateway path_beg /ws/gateway
    acl is_websocket hdr(Upgrade) -i websocket

    use_backend gateway_ws if is_ws_gateway is_websocket
    use_backend gateway_ws if is_ws_gateway
    default_backend bob_agent

backend gateway_ws
    server bob-gateway bob-gateway:8090 check resolvers docker resolve-prefer ipv4 init-addr none

backend bob_agent
    server bob-agent bob-agent:8080 check resolvers docker resolve-prefer ipv4 init-addr none

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 5s
    timeout retry   1s
    hold valid 5s
